<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泰國 GL CP 盲盒極限記憶大挑戰 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
    }

    body {
      background: #111827;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    /* 全螢幕大地震震動特效 */
    body.earthquake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    h1 {
      margin: 5px 0 10px 0;
      color: #f472b6;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
      font-size: 22px;
      text-align: center;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      background: #1f2937;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #374151;
    }

    .badge {
      color: #fbbf24;
      font-weight: bold;
    }

    /* 4x5 網格格局，剛好放下 20 張卡片 */
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 480px;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg);
      opacity: 0.55;
      cursor: default;
    }

    /* 大地震洗牌旋轉動畫 */
    .card.shuffling {
      animation: spinShuffle 0.6s ease-in-out;
    }

    @keyframes spinShuffle {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.8) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* === 卡片背面 (A+C 設計: 拍立得質感手幅 + 斜向金屬流光) === */
    .card-back {
      background: linear-gradient(135deg, #be185d 0%, #ec4899 100%);
      border: 2px solid #fbcfe8;
    }

    /* A 方案：雙對称印花手幅圖案 */
    .card-back::before {
      content: "🌸\a✦ GL ✦\a🌸";
      white-space: pre;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.2;
      opacity: 0.9;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* C 方案：斜向金屬流光動畫 */
    .card-back::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 40%,
        rgba(255, 255, 255, 0.35) 50%,
        transparent 60%
      );
      animation: shimmer 3.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%); }
      100% { transform: translateX(100%) translateY(100%); }
    }

    /* === 卡片正面 === */
    .card-front {
      background: #fff;
      color: #333;
      transform: rotateY(180deg);
      border: 2px solid #f472b6;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-front .name-tag {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(219, 39, 119, 0.85);
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 0;
      text-align: center;
    }

    /* 特殊卡片正面樣式 */
    .card-front.rival {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      padding: 5px;
    }

    .card-front.shuffle {
      background: #fef3c7;
      color: #92400e;
      border: 2px solid #f59e0b;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      padding: 5px;
    }

    /* 訊息提示 Toast */
    .toast {
      position: fixed;
      top: 20px;
      background: #ef4444;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 10px 15px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.combo { background: #10b981; }
    .toast.shuffle { background: #f59e0b; }

    .controls { margin-top: 15px; }

    button {
      background: #ec4899;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: #be185d; }
  </style>
</head>
<body>

  <h1>🌸 GL CP 盲盒極限記憶大挑戰</h1>

  <div class="status-bar">
    <div>配對: <span id="matches" class="badge">0 / 9</span></div>
    <div>Combo: <span id="combo" class="badge">0</span></div>
    <div>步數: <span id="moves" class="badge">0</span></div>
  </div>

  <div class="game-board" id="board"></div>

  <div class="controls">
    <button onclick="initGame()">重新開局</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // 9 對 100% 精確檔名 CP 資料
    const rawData = [
      { id: 1, name: "Lingling", img: "IMG_3907.jpeg" },
      { id: 1, name: "Orm", img: "IMG_3908.jpeg" },
      { id: 2, name: "Freen", img: "IMG_3882.jpeg" },
      { id: 2, name: "Becky", img: "IMG_3884.jpeg" },
      { id: 3, name: "Lena", img: "IMG_3885.jpeg" },
      { id: 3, name: "Miu", img: "IMG_3887.jpeg" },
      { id: 4, name: "Oom", img: "IMG_3888.jpeg" },
      { id: 4, name: "Bam", img: "IMG_3889.jpeg" },
      { id: 5, name: "Emi", img: "IMG_3891.jpeg" },
      { id: 5, name: "Bonnie", img: "IMG_3892.jpeg" },
      { id: 6, name: "Jan", img: "IMG_3893.jpeg" },
      { id: 6, name: "JingJing", img: "IMG_3894.jpeg" },
      { id: 7, name: "Namtan", img: "IMG_3901.jpeg" },
      { id: 7, name: "Film", img: "IMG_3900.jpeg" },
      { id: 8, name: "Milk", img: "IMG_3899.jpeg" },
      { id: 8, name: "Love", img: "IMG_3897.jpeg" },
      { id: 9, name: "Engfa", img: "IMG_3896.jpeg" },
      { id: 9, name: "Charlotte", img: "IMG_3895.jpeg" }
    ];

    let cardsData = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let comboCount = 0;
    let moves = 0;
    let lockBoard = false;

    function initGame() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      comboCount = 0;
      moves = 0;
      lockBoard = false;
      
      updateStatus();

      // 18 張 CP 照片 + 1 張狗仔卡 + 1 張大地震洗牌卡 = 共 20 張卡片 (剛好 4x5 滿格)
      let deck = rawData.map(item => ({ ...item, type: 'cp', isMatched: false }));

      deck.push({ id: 'rival', name: "📸 狗仔偷拍", type: 'rival', isMatched: false });
      deck.push({ id: 'shuffle', name: "🔀 大地震洗牌", type: 'shuffle', isMatched: false });

      // 洗牌
      cardsData = deck.sort(() => Math.random() - 0.5);

      renderBoard();

      // 開局 1.2 秒全場開眼微記憶預覽
      lockBoard = true;
      setTimeout(() => {
        document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));
        setTimeout(() => {
          document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
          lockBoard = false;
        }, 1200);
      }, 300);
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      cardsData.forEach((data, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.index = index;

        if (data.isMatched) {
          card.classList.add('matched');
        }

        let frontHTML = '';
        if (data.type === 'cp') {
          frontHTML = `
            <div class="card-face card-front">
              <img src="${data.img}" alt="${data.name}" onerror="this.src='https://via.placeholder.com/150?text=Image'">
              <div class="name-tag">${data.name}</div>
            </div>`;
        } else if (data.type === 'rival') {
          frontHTML = `<div class="card-face card-front rival">📸<br>狗仔偷拍</div>`;
        } else if (data.type === 'shuffle') {
          frontHTML = `<div class="card-face card-front shuffle">🔀<br>大地震洗牌</div>`;
        }

        card.innerHTML = `<div class="card-face card-back"></div>` + frontHTML;

        card.addEventListener('click', () => handleCardClick(card, data, index));
        board.appendChild(card);
      });
    }

    function handleCardClick(card, data, index) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');

      // 💣 翻到狗仔偷拍卡
      if (data.type === 'rival') {
        lockBoard = true;
        comboCount = 0;
        updateStatus();
        showToast("💣 翻到狗仔偷拍！一組 CP 被強制拆散！", "rival");

        setTimeout(() => {
          card.classList.remove('flipped');
          
          // 強制拆散一組已配對的 CP
          const matchedIndices = cardsData.reduce((acc, curr, idx) => {
            if (curr.isMatched) acc.push(idx);
            return acc;
          }, []);

          if (matchedIndices.length >= 2) {
            const targetId = cardsData[matchedIndices[0]].id;
            cardsData.forEach(c => {
              if (c.id === targetId) c.isMatched = false;
            });
            matchedPairs--;
            renderBoard();
            updateStatus();
          }
          
          lockBoard = false;
        }, 1200);
        return;
      }

      // 🔀 翻到大地震洗牌卡
      if (data.type === 'shuffle') {
        lockBoard = true;
        comboCount = 0;
        updateStatus();
        
        document.body.classList.add('earthquake');
        showToast("🔀 觸發「大地震」！未配對卡片重新洗牌！", "shuffle");

        setTimeout(() => {
          document.body.classList.remove('earthquake');
          card.classList.remove('flipped');
          triggerEarthquakeShuffle();
        }, 1000);
        return;
      }

      // 一般 CP 卡翻牌邏輯
      flippedCards.push({ card, data, index });

      if (flippedCards.length === 2) {
        moves++;
        lockBoard = true;
        const [first, second] = flippedCards;

        // 判定：同 CP ID 且不是同一張卡（不同角色）
        const isMatch = (first.data.id === second.data.id) && (first.data.name !== second.data.name);

        if (isMatch) {
          first.card.classList.add('matched');
          second.card.classList.add('matched');
          cardsData[first.index].isMatched = true;
          cardsData[second.index].isMatched = true;

          matchedPairs++;
          comboCount++;

          // 連續成功 2 次開啟透視眼
          if (comboCount >= 2) {
            showToast(`🔥 Combo x${comboCount}！啟動「透視眼」閃爍！`, "combo");
            triggerXRayVision();
          }

          resetTurn();
          if (matchedPairs === 9) {
            setTimeout(() => alert("🎉 恭喜通關！成功將 9 對 CP 全部配對完成！"), 500);
          }
        } else {
          comboCount = 0;
          setTimeout(() => {
            first.card.classList.remove('flipped');
            second.card.classList.remove('flipped');
            resetTurn();
          }, 1000);
        }
        updateStatus();
      }
    }

    // 大地震洗牌
    function triggerEarthquakeShuffle() {
      let unMatchedIndices = [];
      let unMatchedData = [];

      cardsData.forEach((item, idx) => {
        if (!item.isMatched) {
          unMatchedIndices.push(idx);
          unMatchedData.push(item);
        }
      });

      unMatchedData.sort(() => Math.random() - 0.5);

      unMatchedIndices.forEach((targetIdx, i) => {
        cardsData[targetIdx] = unMatchedData[i];
      });

      const allCards = document.querySelectorAll('.card:not(.matched)');
      allCards.forEach(c => c.classList.add('shuffling'));

      setTimeout(() => {
        renderBoard();
        lockBoard = false;
      }, 600);
    }

    // 透視眼技能
    function triggerXRayVision() {
      const unMatchedCards = Array.from(document.querySelectorAll('.card:not(.matched):not(.flipped)'));
      if (unMatchedCards.length < 2) return;

      const shuffled = unMatchedCards.sort(() => Math.random() - 0.5);
      const peekCards = [shuffled[0], shuffled[1]];

      setTimeout(() => {
        peekCards.forEach(c => c.classList.add('flipped'));
        setTimeout(() => {
          peekCards.forEach(c => c.classList.remove('flipped'));
        }, 600);
      }, 400);
    }

    function resetTurn() {
      flippedCards = [];
      lockBoard = false;
    }

    function updateStatus() {
      document.getElementById('matches').innerText = `${matchedPairs} / 9`;
      document.getElementById('combo').innerText = comboCount;
      document.getElementById('moves').innerText = moves;
    }

    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 2200);
    }

    initGame();
  </script>
</body>
</html>
